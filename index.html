<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjeta Digital ENDE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tarjeta">
    <!-- LOGO INSTITUCIONAL -->
    <img src="img/logo-ende.png" 
         class="logo"
         alt="ENDE Corporación">
    <!-- FOTOGRAFIA -->
    <img src="img/foto.png"
         class="foto"
         alt="Fotografía funcionario">
    <!-- DATOS DEL FUNCIONARIO -->
    <h1 id="nombre">
        Gonzalo Sánchez
    </h1>
    <h2 id="cargo">
        Técnico de Soporte Informático
    </h2>
    <p id="unidad">
        USTI - ENDE Corporación
    </p>
    <hr>
    <!-- BOTONES DE CONTACTO -->
    <a class="boton whatsapp" href="#">
        🟢 WhatsApp
    </a>
    <a class="boton llamar" href="#">
        📞 Llamar
    </a>
    <a class="boton correo" href="#">
        📧 Correo Institucional
    </a>
    <a class="boton contacto" href="#">
        💾 Guardar contacto
    </a>
    <hr>
    <footer>
        ENDE Corporación © 2026
    </footer>
</div>
<script src="script.js"></script>
</body>
</html>
