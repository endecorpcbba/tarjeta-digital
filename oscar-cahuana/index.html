<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tarjeta Digital ENDE</title>

<link rel="stylesheet" href="style.css">

<!-- Iconos Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="contenedor">


    <!-- LOGO INSTITUCIONAL -->
    <img src="img/logo-ende.png" 
         class="logo"
         alt="ENDE Corporación">


    <!-- DATOS DEL FUNCIONARIO -->

    <h1 id="nombre">
        Gonzalo Sánchez
    </h1>


    <h2 id="cargo">
        Técnico de Soporte Informático
    </h2>


    <p id="unidad">
        USTI - ENDE Corporación
    </p>



    <div class="links">



        <!-- GUARDAR CONTACTO -->

        <a id="btnContacto" class="card" href="#">

            <div class="icono">
                <i class="fa-solid fa-address-book"></i>
            </div>


            <div class="texto">

                <h3>
                    Guardar contacto
                </h3>

                <p>
                    Agregar a la agenda del teléfono
                </p>

            </div>


            <div class="flecha">

                <i class="fa-solid fa-angle-right"></i>

            </div>


        </a>





        <!-- WHATSAPP -->

        <a id="btnWhatsapp" class="card" href="#">

            <div class="icono whatsapp">

                <i class="fa-brands fa-whatsapp"></i>

            </div>


            <div class="texto">

                <h3>
                    WhatsApp
                </h3>

                <p id="txtWhatsapp">
                    
                </p>

            </div>


            <div class="flecha">

                <i class="fa-solid fa-angle-right"></i>

            </div>


        </a>





        <!-- CORREO -->

        <a id="btnCorreo" class="card" href="#">

            <div class="icono correo">

                <i class="fa-solid fa-envelope"></i>

            </div>


            <div class="texto">

                <h3>
                    Correo institucional
                </h3>

                <p id="txtCorreo">

                </p>


            </div>


            <div class="flecha">

                <i class="fa-solid fa-angle-right"></i>

            </div>


        </a>






        <!-- LLAMAR -->

        <a id="btnLlamar" class="card" href="#">

            <div class="icono telefono">

                <i class="fa-solid fa-phone"></i>

            </div>


            <div class="texto">

                <h3>
                    Llamar
                </h3>

                <p id="txtTelefono">

                </p>


            </div>


            <div class="flecha">

                <i class="fa-solid fa-angle-right"></i>

            </div>


        </a>



    </div>



    <footer>

        ENDE Corporación © 2026

    </footer>



</div>




<script src="data.js"></script>

<script src="script.js"></script>


</body>

</html>
